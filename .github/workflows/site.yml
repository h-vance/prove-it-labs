name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The site builds its pages straight out of labs/, and the rules about
      # what may be in labs/ live in a Python suite that runs in the other
      # workflow. Two workflows on the same trigger cannot gate each other, so
      # without this the site could build, check itself, pass, and publish while
      # `verify` was red in a tab nobody had open.
      #
      # No install step, because these tests have no dependencies either.
      - name: The content the site is about to publish is valid
        run: |
          python3 tools/tests/test_content.py
          python3 tools/tests/test_meta.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      # The site generates its pages from labs/, so a loader regression shows up
      # as pages quietly not existing rather than as a build error.
      - name: Every exercise has a complete page
        run: npm run check:pages
        working-directory: site

      - name: Install the browser the checks drive
        run: npx playwright install --with-deps chromium
        working-directory: site

      # The terminal's normalizer is a second implementation of one in
      # tools/tse. This is what proves the two still agree, by driving the
      # shipped page rather than a copy of the rules.
      - name: The terminal replays what was recorded
        run: npm run check:terminal
        working-directory: site

      - name: WCAG 2.2 AA, every page, both themes
        run: npm run a11y
        working-directory: site

      # Publishing steps are gated on the repository being public, not just on
      # the branch. GitHub Pages is unavailable to private repositories on the
      # free plan, so without this the deploy fails on every run while the repo
      # is still private. Gating on visibility means it skips cleanly now and
      # starts working the moment the repo is flipped, with nothing to remember.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        with:
          path: site/dist

  deploy:
    name: deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
