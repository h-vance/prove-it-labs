name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One exercise is one job, so a push starts more than twenty of them. Without
# this, pushing twice in a minute leaves the first set running to completion
# against a tree nobody is waiting on. site.yml has had this from the start;
# this workflow is the expensive one and did not.
#
# Not cancelled on main. A run there is the record of whether a commit was good,
# and cancelling it leaves a commit with no answer either way.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # No install step on purpose. If tse ever grows a dependency, this fails.
      - name: CLI runs on a stock interpreter
        run: |
          tools/tse list
          tools/tse list --ids
          tools/tse progress --json

      # Every committed file, not just the recordings. The tree only, because
      # actions/checkout is shallow by default and scanning one commit of
      # history would pass without proving anything. `tse leaks --history` is
      # run locally against a full clone before the repository goes public.
      - name: Nothing from a real machine is committed
        run: tools/tse leaks

      - name: Parser and content tests
        run: |
          python3 tools/tests/test_meta.py
          python3 tools/tests/test_content.py
          python3 tools/tests/test_scrub.py
          python3 tools/tests/test_rubric.py

      # Installed only so the parity test can compare the subset parser against
      # a real YAML implementation. tse itself never requires it.
      - name: Parser agrees with PyYAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/tests/test_meta.py MatchesPyYAML

      - name: CLI smoke test
        run: tools/tests/smoke.sh --fast

  discover:
    name: discover exercises
    runs-on: ubuntu-24.04
    outputs:
      exercises: ${{ steps.collect.outputs.exercises }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: collect
        run: echo "exercises=$(tools/tse list --ids)" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.exercise }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        exercise: ${{ fromJSON(needs.discover.outputs.exercises) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # tse creates and reuses its own cluster, so only the binary is needed.
      # The Kubernetes exercises are the only ones that touch it.
      - name: Install kind
        if: startsWith(matrix.exercise, 'kubernetes/')
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      # An exercise is only correct if it fails in its broken state and passes
      # against its documented solution. Asserting only the second half would
      # let a lab that is not actually broken ship green.
      - name: Verify the exercise fails broken and passes fixed
        run: tools/tse verify "${{ matrix.exercise }}"

      # The site replays these recordings in its terminal, so they are only
      # worth anything if they still match the system. This re-runs every
      # recorded command against the real stack and fails if the output moved.
      # Exercises without a transcript are skipped rather than failed, so a new
      # one can land before it has been recorded.
      - name: Recorded output still matches the system
        run: |
          if [ -f "labs/${{ matrix.exercise }}/transcript.json" ]; then
            tools/tse record --check "${{ matrix.exercise }}"
          else
            echo "no transcript for ${{ matrix.exercise }}, nothing to check"
          fi

  loop:
    name: learner loop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Full smoke test including the Docker loop
        run: tools/tests/smoke.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          shellcheck --severity=warning \
            tools/lib/assert.sh \
            tools/tests/smoke.sh \
            .devcontainer/post-create.sh \
            labs/*/*/check.sh \
            labs/*/*/setup/*.sh \
            labs/*/*/solution/*.sh \
            labs/*/_stack/*.sh
