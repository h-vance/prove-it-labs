# The gateway's live configuration.
#
# GATEWAY_CERT names which of the certificates issued by the internal CA the
# gateway presents to callers. The versions are in /certs on the gateway.
#
# The customer was migrated onto the reports address during last week's work.
services:
  gateway:
    environment:
      GATEWAY_CERT: /certs/v2.pem

  client:
    environment:
      GATEWAY_URL: https://reports:8443
