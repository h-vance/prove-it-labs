# Shared foundation for every Kubernetes exercise.
#
# The application ships as a ConfigMap rather than an image. That keeps the
# track free of a build step and a registry, so the only image pull failure a
# learner ever sees is the one an exercise put there on purpose.
apiVersion: v1
kind: Namespace
metadata:
  name: tse-training
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-source
  namespace: tse-training
data:
  app.py: |
    #!/usr/bin/env python3
    """Order service used as the subject of the Kubernetes investigations."""

    import json
    import os
    import sys
    from http import HTTPStatus
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit

    # Held deliberately so the process footprint can be pushed past a limit.
    BALLAST = []

    if not os.environ.get("APP_SECRET"):
        print("ERROR: required environment variable APP_SECRET is not set", flush=True)
        sys.exit(1)

    allocate_mb = int(os.environ.get("ALLOCATE_MB", "0"))
    if allocate_mb:
        print(f"level=info event=allocating mb={allocate_mb}", flush=True)
        for _ in range(allocate_mb):
            BALLAST.append(bytearray(1024 * 1024))

    ORDERS = [
        {"id": "ord_1001", "company": "Northwind Freight", "total": 4820},
        {"id": "ord_1002", "company": "Beacon Analytics", "total": 1290},
        {"id": "ord_1003", "company": "Copperline Robotics", "total": 7315},
    ]


    class Handler(BaseHTTPRequestHandler):
        server_version = "ProveItOrders/1.0"

        def do_GET(self):
            path = urlsplit(self.path).path
            if path == "/health":
                self.respond(HTTPStatus.OK, {"status": "healthy"})
            elif path == "/ready":
                self.respond(HTTPStatus.OK, {"status": "ready"})
            elif path == "/customers":
                self.respond(HTTPStatus.OK, {"status": "ok", "orders": ORDERS,
                                             "order_count": len(ORDERS)})
            else:
                self.respond(HTTPStatus.NOT_FOUND, {"error": "route_not_found"})

        def respond(self, status, body):
            payload = json.dumps(body).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, fmt, *args):
            print(f"level=info message={fmt % args}", flush=True)


    print("level=info event=server_started port=8080", flush=True)
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
  namespace: tse-training
data:
  APP_SECRET: "lab-secret"
  LOG_LEVEL: "info"
