id: mixed/02-their-sync-reports-success-and-nothing-arrives
track: mixed
title: Their sync reports success on every run and nothing ever arrives
proof_question: Can I prove the request was understood, rather than merely accepted?
stack: compose
stack_source: api
tier: core
difficulty: 3
minutes: 30
prerequisites:
  - docker/03-data-access-lost-after-credential-rotation
  - kubernetes/05-healthy-pods-still-no-traffic
  - api/04-nightly-sync-fails-partway
  - sql/03-report-that-was-instant-got-slow

commands_introduced:
  - curl -D -

evidence_layers:
  - response status
  - response body
  - payload contract

interview_relevance: >
  Silent success is the failure mode candidates handle worst, because every
  habit they have is built around finding an error and there is not one. The
  move that separates people here is reading the response body after seeing a
  success status, and being able to say what the server understood rather than
  what it returned.

teaches: >
  A success status says the request was accepted, not that it did what was
  intended. When a server takes only the fields it recognizes, an unrecognized
  name is not an error, it is an absence, and absence is the hardest thing to
  see in output you were not reading closely.
